status: discontinued
summary: >-
  Linen Wallet (Linen Mobile, Inc.) is no longer operating a public web or developer surface.
  Every path on linen.app — including the support subdomain and all /.well-known/ paths —
  returns an HTTP 301 to a single X (Twitter) post. No documentation, API, portal, pricing,
  terms, privacy or status page resolves. The domain itself is still registered and served
  through Cloudflare with valid TLS and configured SPF/DMARC records, so the redirect is a
  deliberate wind-down of the product rather than an expired domain.

