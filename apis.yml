name: Linen App
description: >-
  Linen Wallet, operated by Linen Mobile, Inc., was a mobile self-custody cryptocurrency wallet
  that used multi-signature protection built on Safe (formerly Gnosis Safe) smart-contract accounts
  instead of the single seed phrase used by most wallets. It began as a DeFi savings wallet earning
  yield on stablecoins through Compound, later adding Ethereum staking and Polygon support, and grew
  out of Bloqboard, a non-custodial digital-asset lending platform built on the Dharma, Compound and
  MakerDAO protocols. Linen was backed by Polychain, Coinbase Ventures, HashKey and Wyre, and won
  Aave and Polygon grants. The product is discontinued — since late 2023 every path on linen.app has
  returned a site-wide redirect to a single X post, and no documentation, developer portal, API or
  specification was ever published publicly. See lifecycle/linen-app-lifecycle.yml for the probed
  wind-down evidence.
